name: Android verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and model assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify model assets
        shell: bash
        run: |
          test "$(sha256sum app/src/main/assets/lama_fp32.onnx | cut -d' ' -f1)" = "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6"
          test "$(sha256sum app/src/main/assets/interactive_segmentation.task | cut -d' ' -f1)" = "38431bc66b883404e8397f74c3579404315b9b52b04a46c6346fe906a7309b03"

      - name: Run Version 1 release gate
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VaultGallery-Version-1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
